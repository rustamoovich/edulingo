services:
  - type: web
    name: edulingo-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOOK_WEBSITE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # WEBHOOK_URL будет автоматически определен из RENDER_EXTERNAL_URL
      - key: DATABASE_PATH
        value: edulingo.db
      - key: FLASK_ENV
        value: production

