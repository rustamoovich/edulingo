<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edulingo Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: #f7f8fa; }
      .navbar-brand { font-weight: 700; letter-spacing: .5px; }
      .card { box-shadow: 0 6px 18px rgba(0,0,0,.06); border: none; }
      .table thead th { white-space: nowrap; }
      .badge-lang { text-transform: uppercase; letter-spacing: .5px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('users') }}">Edulingo Admin</a>
        <div class="d-flex">
          {% if session.get('logged_in') %}
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Выйти</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container my-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
