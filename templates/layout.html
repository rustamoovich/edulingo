<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edulingo Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Иконки флагов (https://flagicons.lipis.dev) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
    <style>
      body { background: #f7f8fa; }
      .navbar-brand { font-weight: 700; letter-spacing: .5px; }
      .card { box-shadow: 0 6px 18px rgba(0,0,0,.06); border: none; }
      .table thead th { white-space: nowrap; }
      .badge-lang { text-transform: uppercase; letter-spacing: .5px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('users') }}">Edulingo Admin</a>
        <div class="d-flex">
          {% if session.get('logged_in') %}
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Выйти</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container my-4">
      {% block content %}{% endblock %}
    </div>

    <!-- Toast контейнер для flash-сообщений -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 11;">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="toast align-items-center text-white bg-{{ category }} border-0" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="d-flex">
                <div class="toast-body">
                  {{ message }}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
              </div>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Автоматическое показ и скрытие toast-уведомлений
      document.addEventListener('DOMContentLoaded', function() {
        const toasts = document.querySelectorAll('.toast');
        toasts.forEach(function(toastEl) {
          const toast = new bootstrap.Toast(toastEl, {
            autohide: true,
            delay: 3000
          });
          toast.show();
        });
      });
    </script>
  </body>
</html>
